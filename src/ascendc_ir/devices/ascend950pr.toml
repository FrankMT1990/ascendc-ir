[device]
id = "ascend950pr"
npu_arch = 3510

[memory]
ub_usable_bytes = 253952    # 248KB；物理 256KB，编译器预留 8KB
l1_bytes = 524288           # 512KB
align_bytes = 32

[pipes]
available = ["s", "v", "m", "mte1", "mte2", "mte3", "fix"]
event_ids = 8

[pathways]
"gm->ubuf" = "mte2"
"ubuf->gm" = "mte3"
"ubuf->ubuf" = "v"
